name: Build and upload release jars

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build all configured Minecraft versions and loaders
        run: ./gradlew --no-daemon buildAll --stacktrace

      - name: Prepare release JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "No JARs were produced in build/libs"
            exit 1
          fi
          for jar in "${jars[@]}"; do
            filename="${jar##*/}"
            if [[ "$filename" =~ \+mc([0-9.]+)-(fabric|forge|neoforge)\.jar$ ]]; then
              game_version="${BASH_REMATCH[1]}"
              loader="${BASH_REMATCH[2]}"
              loader="${loader^}"
              cp -- "$jar" "release-assets/VisorHolster-${loader}-${game_version}.jar"
            else
              echo "Unexpected JAR filename: $filename"
              exit 1
            fi
          done
          expected="$(python3 -c 'import tomllib; data = tomllib.load(open("stonecutter.properties.toml", "rb")); print(sum(len(loaders) for loaders in data["targets"].values()))')"
          actual="$(find release-assets -maxdepth 1 -type f -name '*.jar' | wc -l)"
          if [[ "$actual" -ne "$expected" ]]; then
            echo "Expected $expected release JARs from Stonecutter targets, found $actual"
            exit 1
          fi
          ls -1 release-assets

      - name: Create GitHub Release and upload JARs
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.jar


