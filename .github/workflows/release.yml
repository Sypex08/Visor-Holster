name: Build and upload release jars

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish to Modrinth
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build all configured Minecraft versions and loaders
        run: ./gradlew --no-daemon buildAll --stacktrace

      - name: Prepare release JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "No JARs were produced in build/libs"
            exit 1
          fi
          release_version="${GITHUB_REF_NAME#v}"
          for jar in "${jars[@]}"; do
            filename="${jar##*/}"
            if [[ "$filename" =~ \+mc([0-9.]+)-(fabric|forge|neoforge)\.jar$ ]]; then
              game_version="${BASH_REMATCH[1]}"
              loader="${BASH_REMATCH[2]}"
              loader="${loader^}"
              cp -- "$jar" "release-assets/VisorHolster-${release_version}-${loader}-${game_version}.jar"
            else
              echo "Unexpected JAR filename: $filename"
              exit 1
            fi
          done
          expected="$(python3 -c 'import tomllib; data = tomllib.load(open("stonecutter.properties.toml", "rb")); print(sum(len(loaders) for loaders in data["targets"].values()))')"
          actual="$(find release-assets -maxdepth 1 -type f -name '*.jar' | wc -l)"
          if [[ "$actual" -ne "$expected" ]]; then
            echo "Expected $expected release JARs from Stonecutter targets, found $actual"
            exit 1
          fi
          ls -1 release-assets

      - name: Create GitHub Release and upload JARs
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.jar

      - name: Publish JARs to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          MODRINTH_RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python3 scripts/publish_modrinth.py

  publish-existing-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download JARs from the existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v, got: $RELEASE_TAG"
            exit 1
          fi
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --repo "$REPOSITORY"
          shopt -s nullglob
          jars=(release-assets/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "The GitHub Release $RELEASE_TAG contains no JAR files"
            exit 1
          fi
          ls -1 release-assets

      - name: Publish existing JARs to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          MODRINTH_RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python3 scripts/publish_modrinth.py
